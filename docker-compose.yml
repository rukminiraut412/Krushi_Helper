version: '3.8'

services:
  # Database service for KrushiRakshak
  db:
    image: postgres:16-alpine
    container_name: krushirakshak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krushirakshak
      POSTGRES_PASSWORD: krushirakshak_secret
      POSTGRES_DB: krushirakshak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krushirakshak -d krushirakshak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
